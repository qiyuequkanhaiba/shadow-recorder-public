name: Desktop Benchmark Compare

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      baseline_path:
        description: Required benchmark baseline JSON path (repo-relative or absolute on runner).
        required: true
      candidate_path:
        description: Required benchmark candidate JSON path (repo-relative or absolute on runner).
        required: true
      capture_goal:
        description: Optional capture improvement goal ratio in [0,1].
        required: false
        default: "0.15"
      encode_goal:
        description: Optional encode improvement goal ratio in [0,1].
        required: false
        default: "0.15"
      drop_goal:
        description: Optional drop-rate improvement goal ratio in [0,1].
        required: false
        default: "0.30"
      pr_number:
        description: Optional PR number to post benchmark summary comment.
        required: false
        default: ""

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: examples/desktop

      - name: Run benchmark compare
        id: compare
        continue-on-error: true
        shell: pwsh
        working-directory: examples/desktop
        run: |
          New-Item -ItemType Directory -Path .ci-artifacts -Force | Out-Null
          npm run bench:compare -- --baseline "${{ github.event.inputs.baseline_path }}" --candidate "${{ github.event.inputs.candidate_path }}" --capture-goal "${{ github.event.inputs.capture_goal }}" --encode-goal "${{ github.event.inputs.encode_goal }}" --drop-goal "${{ github.event.inputs.drop_goal }}" --result-json ".ci-artifacts/benchmark-compare-result.json" --result-md ".ci-artifacts/benchmark-compare-result.md"

      - name: Upload benchmark compare artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-benchmark-compare
          path: |
            examples/desktop/.ci-artifacts/benchmark-compare-result.json
            examples/desktop/.ci-artifacts/benchmark-compare-result.md
          if-no-files-found: warn

      - name: Publish benchmark compare step summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "examples/desktop/.ci-artifacts/benchmark-compare-result.md"
          if (Test-Path $summaryPath) {
            Get-Content -Path $summaryPath -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Benchmark compare markdown report was not generated." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Comment PR with benchmark summary
        if: always() && github.event.inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shadow-recorder:desktop-benchmark-compare -->';
            const prNumber = Number('${{ github.event.inputs.pr_number }}');
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pr_number input: "${{ github.event.inputs.pr_number }}"`);
              return;
            }

            const summaryPath = 'examples/desktop/.ci-artifacts/benchmark-compare-result.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Benchmark compare markdown report was not generated.';

            const body = [
              marker,
              '### Desktop Benchmark Compare',
              '',
              summary,
              '',
              `Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              typeof comment.body === 'string' &&
              comment.body.includes(marker) &&
              comment.user &&
              comment.user.type === 'Bot',
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Enforce benchmark compare pass
        if: steps.compare.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Benchmark compare did not meet configured goals or failed to run."
          exit 1
