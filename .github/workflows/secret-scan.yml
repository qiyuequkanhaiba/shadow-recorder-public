name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public Repository Boundary
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Audit tracked public content
        shell: pwsh
        run: pwsh -File .\scripts\public-repo-audit.ps1

      - name: Audit public release metadata
        shell: pwsh
        run: pwsh -File .\scripts\public-release-metadata-audit.ps1

      # gitleaks-action v2.3.9
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
