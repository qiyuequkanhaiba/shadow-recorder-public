<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>影子录制器</title>
    <script>
      (function () {
        try {
          var key = 'reqcase.shadow-recorder.theme';
          var mode = localStorage.getItem(key) || 'dark';
          if (mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'dark';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', mode);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src-react/main.tsx"></script>
  </body>
</html>
